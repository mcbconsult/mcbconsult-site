<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCB Consult – Digital Branding</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f0f0f;
--panel:#151515;
--border:#2a2a2a;
--text:#fff;
--muted:#b3b3b3;
--accent:#0826cf;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}

.announcement{
  width:100%;
  overflow:hidden;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  font-size:16px;
  white-space:nowrap;
  box-sizing:border-box;
}

.announcement-text{
  display:inline-block;
  padding-left:100%;
  animation:scrollLeft 15s linear infinite;
}

@keyframes scrollLeft {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

header{
position:sticky;top:0;z-index:100;
display:flex;justify-content:space-between;align-items:center;
padding:20px 56px;background:rgba(15,15,15,.9);
border-bottom:1px solid var(--border)
}

header h1{
  color:var(--accent);
  font-size:28px;
  margin:0;
}

nav{
display:flex;gap:12px;align-items:center;
padding:10px 22px;border-radius:999px;
border:1px solid var(--border);background:#151515
}

nav a,select{
padding:8px 18px;border-radius:999px;
text-decoration:none;background:none;border:none;
color:#ccc;font-weight:500;cursor:pointer
}

nav a:hover{background:var(--accent);color:#fff}

section{
max-width:1100px;margin:auto;padding:140px 56px;
display:none;text-align:center
}
section.active{display:block}

h1{font-size:64px;margin-bottom:24px}
h2{font-size:44px;margin-bottom:24px}
h3{font-size:28px;margin-bottom:16px}
p{color:var(--muted);font-size:17px;line-height:1.7;max-width:760px;margin:auto}

.btn{
margin-top:32px;padding:16px 36px;border-radius:999px;
border:none;font-weight:600;cursor:pointer;
background:var(--accent);
color:#fff;
transition:0.3s;
}
.btn:hover{opacity:0.85;}

.divider{
margin:90px auto;height:1px;width:80%;
background:linear-gradient(to right,transparent,var(--border),transparent)
}

.grid{
margin-top:64px;
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:28px
}

.card{
background:var(--panel);border:1px solid var(--border);
border-radius:18px;padding:36px
}

.team-bar{
margin-top:48px;display:flex;justify-content:center;
gap:24px;flex-wrap:wrap
}
.team-member{
padding:14px 30px;border-radius:999px;
border:1px solid var(--border);background:#101010;font-weight:600
}

form{
max-width:520px;margin:40px auto 0;
display:flex;flex-direction:column;gap:18px
}
input,select{
padding:14px 18px;border-radius:12px;
border:1px solid var(--border);
background:#101010;color:#fff;font-size:15px
}

footer{
border-top:1px solid var(--border);
padding:40px;text-align:center;color:#777;font-size:14px
}
</style>
</head>

<body>

<!-- ANNOUNCEMENT -->
<div class="announcement">
  <div class="announcement-text" id="announcementText"></div>
</div>

<header>
<h1>MCB Consult</h1>
<nav>
<a onclick="showPage('home')">Start</a>
<a onclick="showPage('about')">Over ons</a>
<a onclick="showPage('services')">Diensten</a>
<a onclick="showPage('contact')">Contact</a>

<select onchange="setLang(this.value)">
<option value="nl">NL</option>
<option value="en">EN</option>
<option value="fr">FR</option>
<option value="tr">TR</option>
</select>
</nav>
</header>

<!-- HOME -->
<section id="home" class="active">
<h1 id="heroTitle"></h1>
<p id="heroText"></p>
<button class="btn" onclick="showPage('contact')" id="heroBtn"></button>

<div class="divider"></div>

<h3 id="whatTitle"></h3>
<p id="whatText"></p>
<button class="btn" onclick="showPage('services')" id="whatBtn"></button>

<div class="divider"></div>

<h3 id="howTitle"></h3>
<p id="howText"></p>
<button class="btn" onclick="showPage('about')" id="howBtn"></button>

<div class="divider"></div>

<h3 id="whyTitle"></h3>
<p id="whyText"></p>
<button class="btn" onclick="showPage('contact')" id="whyBtn"></button>
</section>

<!-- ABOUT -->
<section id="about">
<h2 id="aboutTitle"></h2>
<p id="aboutText1"></p>

<div class="divider"></div>

<p id="aboutText2"></p>

<div class="team-bar">
<div class="team-member">Cem B.</div>
<div class="team-member">Klyian V.</div>
</div>

<p style="margin-top:32px;font-size:15px;color:#888;">
Rollen en functies worden later verder besproken.
</p>
</section>

<!-- SERVICES -->
<section id="services">
<h2 id="servicesTitle"></h2>
<div class="grid" id="servicesGrid"></div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2 id="contactTitle"></h2>
<p id="contactText"></p>

<form>
<input id="fname" type="text" required>
<input id="lname" type="text">
<select id="serviceSelect" required></select>
<input id="email" type="email" required>
<button class="btn" type="submit" id="sendBtn"></button>
</form>
</section>

<footer>
<p>© 2025 MCB Consult</p>

<div style="margin-top:24px;">
<strong>Meer van ons</strong>
<div style="margin-top:12px;display:flex;gap:18px;justify-content:center;">
<a href="https://www.instagram.com/mcbconsult/" target="_blank" style="color:#ccc;text-decoration:none">Instagram</a>
<a href="#" style="color:#ccc;text-decoration:none">LinkedIn</a>
<a href="#" style="color:#ccc;text-decoration:none">Twitter</a>
</div>
</div>
</footer>

function setLang(l){
const d=t[l];
heroTitle.innerText=d.heroTitle;
heroText.innerText=d.heroText;
heroBtn.innerText=d.heroBtn;
whatTitle.innerText=d.whatTitle;
whatText.innerText=d.whatText;
whatBtn.innerText=d.whatBtn;
howTitle.innerText=d.howTitle;
howText.innerText=d.howText;
howBtn.innerText=d.howBtn;
whyTitle.innerText=d.whyTitle;
whyText.innerText=d.whyText;
whyBtn.innerText=d.whyBtn;
aboutTitle.innerText=d.aboutTitle;
aboutText1.innerText=d.aboutText1;
aboutText2.innerText=d.aboutText2;
servicesTitle.innerText=d.servicesTitle;
contactTitle.innerText=d.contactTitle;
contactText.innerText=d.contactText;

fname.placeholder=d.form.fname;
lname.placeholder=d.form.lname;
email.placeholder=d.form.email;
sendBtn.innerText=d.form.send;

serviceSelect.innerHTML=`<option value="">${d.form.service}</option>`;
d.services.forEach(s=>serviceSelect.innerHTML+=`<option>${s.title}</option>`);

servicesGrid.innerHTML="";
d.services.forEach(s=>{
servicesGrid.innerHTML+=`
<div class="card">
<h3>${s.title}</h3>
<p>${s.desc}</p>
</div>`;
});

// Announcement text
announcementText.innerText = announcementTexts[l];
}
setLang("nl");

function showPage(id){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
window.scrollTo(0,0);
}
